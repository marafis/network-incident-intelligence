name: Alert-Consumer Build, Push & Update Helm Chart

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/alert-consumer/**'
      - '../../gitops/alert-consumer/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      # =========================
      # 🔵 CI PHASE START
      # =========================
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set image variables
        run: |
          echo "IMAGE=${{ github.repository_owner }}/alert-consumer" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: 3. Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and push image
        run: |
          docker build -f services/alert-consumer/Dockerfile -t ${IMAGE_NAME}:${TAG} -t ${IMAGE_NAME}:latest services/alert-consumer
          docker push ${IMAGE_NAME}:${TAG}
          docker push ${IMAGE_NAME}:latest

      # =========================
      # 🟢 CD PHASE START (GitOps)
      # =========================
      # -------------------------
      # CD PHASE (GitOps) - update manifests in this repo
      # We no longer checkout a separate infra repository. The GitOps manifests
      # live in this repository under gitops/infrastructure/alert-consumer.
      # -------------------------

      - name: 5. Verify deployment file exists (CD)
        run: |
          test -f gitops/infrastructure/alert-consumer/deployment.yaml

      - name: 6. Update image in deployment file (CD)
        run: |
          # Replace image tag in the plain manifest so ArgoCD will pick up the new image
          sed -i "s|image: .*alert-consumer:.*|image: ${IMAGE_NAME}:${TAG}|g" gitops/infrastructure/alert-consumer/deployment.yaml

      - name: 7. Commit and push manifest update (CD)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/infrastructure/alert-consumer/deployment.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update alert-consumer image to ${TAG}"
          git push origin HEAD

