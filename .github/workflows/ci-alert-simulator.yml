name: Build, Push & Update Helm Chart

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/alert-simulator/**'
      - 'charts/alert-simulator/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    env:
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/alert-simulator
      IMAGE_TAG: ${{ github.sha }}
      SHORT_TAG: ${{ github.sha }}

    steps:
      - name: 1. Checkout repo
        uses: actions/checkout@v4

      - name: 2. Set image variables
        run: |
          echo "SHORT_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "IMAGE_REPO=ghcr.io/${{ github.repository_owner }}/alert-simulator" >> $GITHUB_ENV

      - name: 3. Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and push image
        run: |
          docker build -f services/alert-simulator/Dockerfile -t $IMAGE_REPO:$SHORT_TAG -t $IMAGE_REPO:latest services/alert-simulator
          docker push $IMAGE_REPO:$SHORT_TAG
          docker push $IMAGE_REPO:latest

      - name: 5. Update chart image tag in repo
        run: |
          sed -i "s|^  repository: .*|  repository: $IMAGE_REPO|g" charts/alert-simulator/values.yaml
          sed -i "s|^  tag: .*|  tag: $SHORT_TAG|g" charts/alert-simulator/values.yaml

      - name: 6. Commit and push chart update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/alert-simulator/values.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update alert-simulator chart to $SHORT_TAG"
          git push origin HEAD
