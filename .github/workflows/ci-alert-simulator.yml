name: Build, Push & Update Helm Chart

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/alert-simulator/**'
      - 'charts/alert-simulator/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: 1. Checkout repo
        uses: actions/checkout@v4
        with:
          # Required to push changes back to the repository
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Set image variables
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Convert owner/repository to lowercase to avoid GHCR rejection
          LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          echo "SHORT_TAG=${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMAGE_REPO=ghcr.io/${LOWER_OWNER}/alert-simulator" >> $GITHUB_ENV

      - name: 3. Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Build and push image
        run: |
          docker build -f services/alert-simulator/Dockerfile -t ${IMAGE_REPO}:${SHORT_TAG} -t ${IMAGE_REPO}:latest services/alert-simulator
          docker push ${IMAGE_REPO}:${SHORT_TAG}
          docker push ${IMAGE_REPO}:latest

      - name: 5. Update chart image tag in repo
        run: |
          sed -i "s|^  repository: .*|  repository: ${IMAGE_REPO}|g" charts/alert-simulator/values.yaml
          sed -i "s|^  tag: .*|  tag: \"${SHORT_TAG}\"|g" charts/alert-simulator/values.yaml

      - name: 6. Commit and push chart update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/alert-simulator/values.yaml
          
          # Exit cleanly if values.yaml didn't change
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          # [skip ci] prevents triggering an infinite workflow loop
          git commit -m "chore(helm): update alert-simulator image to ${SHORT_TAG} [skip ci]"
          git push origin HEAD:${{ github.ref }}