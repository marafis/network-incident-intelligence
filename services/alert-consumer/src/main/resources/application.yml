spring:
  application:
    name: alert-consumer

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:kafka-bootstrap.nii.svc:9092}
          configuration:
            security.protocol: PLAINTEXT
            group.id: alert-consumer-group
            enable.auto.commit: true
            auto.commit.interval.ms: 5000
            session.timeout.ms: 30000
      bindings:
        network-alerts-in-0:
          destination: network-alerts
          content-type: application/json
          group: alert-consumer-group
          consumer:
            concurrency: 1
      function:
        definition: alertConsumer

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 25
        jdbc.fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:nii-postgresql.nii.svc}:${DB_PORT:5432}/${DB_NAME:incident_db}
    username: ${DB_USER:incident_db}
    password: ${DB_PASSWORD:Inc1d3nt@Db.Secure.2025}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      auto-commit: true

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

consumer:
  enrichment:
    enabled: true
    lookup-metadata: true
    calculate-severity-score: true
    add-runbook-reference: true

  dead-letter:
    enabled: true
    topic: alerts-dead-letter
    max-retries: 3

  deduplication:
    enabled: false
    window-minutes: 5
    cache-size: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      version: 1.0.0
      environment: ${ENVIRONMENT:development}

logging:
  level:
    root: INFO
    com.marafis.nii: DEBUG
    org.springframework.cloud.stream: DEBUG
    org.apache.kafka: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8082
  servlet:
    context-path: /

