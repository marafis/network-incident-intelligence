apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nii-kafka-topics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/marafis/network-incident-intelligence
    targetRevision: main
    path: gitops/infrastructure/kafka/topics
  destination:
    server: https://kubernetes.default.svc
    namespace: nii-kafka
  ignoreDifferences:
    - group: kafka.strimzi.io
      kind: KafkaTopic
      jsonPointers:
        - /spec/partitions
        - /spec/replicas
        - /metadata/annotations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true