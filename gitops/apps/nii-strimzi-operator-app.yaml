apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nii-strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    description: "NII Infrastructure - Kafka, PostgreSQL, Qdrant, Redis, Ollama"
spec:
  project: default

  source:
    repoURL: https://github.com/marafis/network-incident-intelligence
    targetRevision: main
    path: gitops/infrastructure
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: nii

  syncPolicy:
    automated:
      prune: false        # Preserve data if app is removed
      selfHeal: true      # Auto-sync on drift
    syncOptions:
      - CreateNamespace=true
      - Validate=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore operator-managed and ephemeral fields
  ignoreDifferences:
    - group: strimzi.io
      kind: Kafka
      jsonPointers:
        - /status
        - /metadata/generation
    - group: strimzi.io
      kind: KafkaTopic
      jsonPointers:
        - /status
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
        - /status
    - group: ""
      kind: Pod
      jsonPointers:
        - /status
    - group: storage.k8s.io
      kind: StorageClass
      jsonPointers:
        - /provisioner