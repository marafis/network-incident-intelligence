# WHY: Strimzi operator moved to nii-kafka namespace — same namespace
# as the Kafka cluster it manages.
#
# The root cause of the infinite restart loop was DNS resolution failure:
# the operator in strimzi-system could not resolve
# nii-kafka-cluster-kafka-bootstrap.nii-kafka.svc from its namespace.
# Every reconciliation cycle it concluded the broker was unreachable
# and rolled the pod — even though the broker was running fine.
#
# Running operator in the same namespace as Kafka eliminates the
# cross-namespace DNS resolution problem entirely. The operator
# connects to nii-kafka-cluster-kafka-bootstrap directly without
# the .nii-kafka.svc suffix lookup that was failing.
#
# watchNamespaces removed — when operator runs in the same namespace
# as Kafka it watches that namespace by default via STRIMZI_NAMESPACE
# which is set to the deployment namespace automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nii-strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.45.0
    helm:
      valuesObject:
        watchAnyNamespace: false
        extraEnvs:
          - name: STRIMZI_KUBERNETES_VERSION
            value: "major=1, minor=30"
        operationTimeoutMs: 600000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
  destination:
    server: https://kubernetes.default.svc
    namespace: nii-kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true