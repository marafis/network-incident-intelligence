# WHY: Strimzi 0.43.0 supports Kafka 3.7.0 and 3.6.x.
# We pin to 3.7.0 — latest supported by this operator version.
# All replication factors set to 1 because we have a single broker.
# nodeSelector ensures ALL Kafka pods land on Server 2 (worker node)
# keeping the control plane free for ArgoCD and ingress.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-kafka
spec:
  kafka:
    version: 3.7.0
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
    template:
      pod:
        nodeSelector:
          workload-type: heavy
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "768Mi"
        cpu: "500m"
    storage:
      type: persistent-claim
      size: 10Gi
      class: local-path
      deleteClaim: false
  zookeeper:
    replicas: 1
    template:
      pod:
        nodeSelector:
          workload-type: heavy
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "384Mi"
        cpu: "300m"
    storage:
      type: persistent-claim
      size: 5Gi
      class: local-path
      deleteClaim: false
  entityOperator:
    # WHY: entityOperator runs the TopicOperator and UserOperator.
    # TopicOperator watches KafkaTopic CRs and creates/deletes
    # topics in the broker automatically — this is how our
    # kafka-topics.yaml manifests get applied inside Kafka.
    topicOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"
    userOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"