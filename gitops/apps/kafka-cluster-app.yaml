# WHY: Deliberately separated from the operator app so that
# sync-wave ordering is enforced. If both were in the same app,
# ArgoCD might try to create the Kafka CR before the CRD exists,
# causing a sync failure on first install.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nii-kafka-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/marafis/network-incident-intelligence
    targetRevision: main
    path: gitops/infrastructure/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: nii-kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true