apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nii-strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 1.0.0
    helm:
      valuesObject:
        # WHY: operationTimeoutMs is a native Helm value in Strimzi 1.0.0
        # that maps to STRIMZI_OPERATION_TIMEOUT_MS env var automatically.
        # Setting it via extraEnvs as well causes a duplicate key error
        # that breaks ArgoCD's structured merge diff entirely.
        # 600000ms = 10 minutes — gives KRaft leader election enough time
        # on resource-constrained hardware before the operator concludes
        # the broker is unreachable and triggers a pod restart.
        operationTimeoutMs: 600000
        extraEnvs:
          - name: STRIMZI_KUBERNETES_VERSION
            value: "major=1, minor=30"
            # WHY: K3s 1.35 returns non-standard fields in its version API
            # response that Strimzi's parser cannot handle. We provide the
            # version explicitly in the exact map format Strimzi expects.
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
  destination:
    server: https://kubernetes.default.svc
    namespace: nii-kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true