# WHY: Strimzi 0.45.0 has a known incompatibility with ArgoCD
# ServerSideApply causing the ServiceAccount to not be created
# before the operator Deployment starts — resulting in a
# CrashLoopBackOff. Version 0.43.0 is stable with ArgoCD GitOps
# and supports Kafka 3.7.x on single-broker Zookeeper mode,
# which is correct for our resource-constrained single-node setup.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nii-strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.43.0
    helm:
      values: |
        watchNamespaces:
          - nii-kafka
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
  destination:
    server: https://kubernetes.default.svc
    namespace: nii-kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true