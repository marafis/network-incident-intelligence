apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-production
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: network-incident-intelligence
    component: kafka
spec:
  project: default
  source:
    repoURL: https://github.com/marafis/network-incident-intelligence
    targetRevision: main
    path: gitops/infrastructure/kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: nii-infrastructure
  syncPolicy:
    automated:
      prune: false  # Don't auto-delete topics
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: kafka.strimzi.io
      kind: KafkaNodePool
      jsonPointers:
        - /metadata/annotations
        - /status
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
      jsonPointers:
        - /subjects
    - group: kafka.strimzi.io
      kind: Kafka
      jsonPointers:
        - /metadata/annotations
        - /status