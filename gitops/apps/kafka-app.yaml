# WHY: Installs the Strimzi OPERATOR ONLY via official Helm chart.
# The operator creates all its own RBAC, CRDs, ServiceAccounts.
# We must never manually create those — that causes the duplicate
# ownership errors we hit earlier.
# sync-wave "2" — runs after base infrastructure (wave 0/1) but
# before the Kafka cluster (wave 3) so CRDs exist first.
# ServerSideApply required — Strimzi CRDs exceed the 256KB
# annotation limit that client-side apply enforces.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nii-strimzi-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://strimzi.io/charts/
    chart: strimzi-kafka-operator
    targetRevision: 0.43.0
    helm:
      values: |
        watchNamespaces:
          - nii-kafka
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "500m"
  destination:
    server: https://kubernetes.default.svc
    namespace: strimzi-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true