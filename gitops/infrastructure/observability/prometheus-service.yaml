apiVersion: v1
kind: Service
metadata:
  name: nii-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: nii
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: nii
  ports:
    - name: web
      port: 9090
      targetPort: web
      protocol: TCP