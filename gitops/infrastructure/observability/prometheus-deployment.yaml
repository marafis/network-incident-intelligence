apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nii-prometheus-data
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: nii
    app.kubernetes.io/component: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nii-prometheus
  namespace: nii
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: nii
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: nii

  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/instance: nii
        app.kubernetes.io/component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"

    spec:
      # Affinity: run on services-plane to avoid contending with data services
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: nii/role
                    operator: In
                    values:
                      - services-plane

      # Security context
      securityContext:
        fsGroup: 65534  # nobody user
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault

      serviceAccountName: nii-prometheus

      containers:
        - name: nii-prometheus
          image: prom/prometheus:latest
          imagePullPolicy: Always

          ports:
            - name: web
              containerPort: 9090
              protocol: TCP

          # Prometheus command-line args
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'  # 15 days retention
            - '--storage.tsdb.retention.size=18GB'  # Leave 2GB buffer on 20Gi disk
            - '--web.console.libraries=/usr/share/prometheus/console_libraries'
            - '--web.console.templates=/usr/share/prometheus/consoles'
            - '--web.enable-lifecycle'  # Allow reload via /-/reload endpoint
            - '--query.timeout=2m'
            - '--log.level=info'

          env:
            - name: PROMETHEUS_CONFIG_RELOAD_INTERVAL
              value: "1m"

          # Health checks
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: web
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /-/ready
              port: web
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

          # Resource limits
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          # Volume mounts
          volumeMounts:
            - name: nii-prometheus-config
              mountPath: /etc/prometheus
            - name: nii-prometheus-rules
              mountPath: /etc/prometheus/rules
            - name: nii-prometheus-data
              mountPath: /prometheus

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

      # Volumes
      volumes:
        - name: nii-prometheus-config
          configMap:
            name: nii-prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
        - name: nii-prometheus-rules
          configMap:
            name: nii-prometheus-rules
            items:
              - key: alert-rules.yml
                path: alert-rules.yml
        - name: nii-prometheus-data
          persistentVolumeClaim:
            claimName: nii-prometheus-data

---
# ServiceAccount for Prometheus (for accessing Kubernetes API)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nii-prometheus
  namespace: nii
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: nii

---
# ClusterRole for Prometheus to scrape metrics from all namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nii-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: nii
rules:
  # Nodes
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  # Services, endpoints, pods
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  # ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  # Namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]

---
# ClusterRoleBinding for Prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nii-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: nii
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nii-prometheus
subjects:
  - kind: ServiceAccount
    name: nii-prometheus
    namespace: nii