## Key Configuration Details

### Kafka (kafka-cluster.yaml)
- **Version:** 3.9.0
- **Mode:** KRaft (no Zookeeper)
- **metadataVersion:** 3.9-IV0 (matches Kafka 3.9.0)
- **Brokers:** 3 replicas (StatefulSet)
- **Storage:** JBOD, 20Gi per broker, local-path provisioner
- **Retention:** 7 days for main topics, 30 days for DLQ
- **JVM:** -Xms 512m, -Xmx 768m, G1GC tuned
- **Metrics:** JMX Prometheus exporter enabled

### PostgreSQL (postgresql-statefulset.yaml)
- **Version:** 16-alpine
- **Database:** incident_db (created by init container)
- **Users:** postgres (superuser), incident_db (app user)
- **Storage:** 50Gi persistent, local-path provisioner
- **Credentials:** Secret postgresql-credentials (postgres-password, incident-db-password)
- **Init:** Creates database and user automatically
- **Exporter:** postgres-exporter for Prometheus metrics
- **Probes:** Liveness & readiness via pg_isready

### Qdrant (qdrant-deployment.yaml)
- **Version:** latest (auto-updates)
- **Storage:** 10Gi persistent, local-path provisioner
- **API:** REST on :6333, gRPC on :6334
- **Auth:** API key stored in secret qdrant-api-key
- **Memory:** Request 256Mi, Limit 512Mi
- **Config:** Snapshots, collections, temp paths configured

### Redis (redis-deployment.yaml)
- **Version:** 7-alpine
- **Memory Policy:** allkeys-lru (LRU eviction when full)
- **Persistence:** AOF (append-only file) enabled
- **Max Memory:** 96Mi soft limit
- **Storage:** emptyDir 100Mi (ephemeral, lost on restart)
- **Exporter:** redis_exporter for Prometheus metrics

### Ollama (ollama-deployment.yaml)
- **Version:** latest (auto-updates)
- **Model:** llama2:7b (pulled by postStart hook)
- **Memory:** Request 0Mi (on-demand), Limit 1.5Gi
- **Threads:** 2 (tuned for 2 CPU limit)
- **Keep-Alive:** 5 minutes (model stays in memory)
- **Cache:** emptyDir 2Gi for model downloads
- **Inference:** API on :11434

