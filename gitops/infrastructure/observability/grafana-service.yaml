## Critical Implementation Notes

### 1. Strimzi KRaft Mode (No Zookeeper)
- **metadataVersion: 3.9-IV0** is **crucial** — must match Kafka 3.9.0
- Broker quorum voters explicitly configured in broker config
- CONTROLLER listener for quorum, PLAINTEXT for clients
- No zookeeper replicas (replicas: 0) in spec

### 2. Same-Namespace Operator (Previous Lesson)
- Strimzi operator deployed in `nii` namespace (not `strimzi-system`)
- Kafka cluster and topics in `nii` namespace
- Fixes DNS resolution failures from cross-namespace operator

### 3. PostgreSQL Initialization
- Init container runs AFTER pod scales up
- Waits for PostgreSQL to be ready (pg_isready loop)
- Creates incident_db database and incident_db user
- Grants all privileges on incident_db to incident_db user
- Credentials sourced from Secret

### 4. Redis emptyDir (Not Persistent)
- Redis data is ephemeral (lost on pod restart)
- Acceptable for agent memory + caching (session data, not business-critical)
- To make persistent: replace emptyDir with PVC

### 5. Ollama On-Demand (Resource Efficiency)
- Request 0Mi, Limit 1.5Gi = only consumed when model loads
- PostStart lifecycle hook pulls model asynchronously
- Model download (~1-2 mins for llama2:7b) happens in background
- Readiness probe waits for API to respond (may take 2-5 mins total)
- If Pod killed before model downloads, next Pod re-downloads (normal)

### 6. Local-Path Provisioner (Kubernetes Native)
- Uses `/var/lib/rancher/k3s/data/` on each node
- Works on single-node or small clusters
- No network storage complexity
- Sufficient for Phase 0-1 development

### 7. Node Affinity (Strict Placement)
- Data-plane services use `requiredDuringSchedulingIgnoredDuringExecution` → must place on worker-node-01
- Prevents Kafka + PostgreSQL + Qdrant competing with LLM for resources
- Ensure worker-node-01 has label `nii/role=data-plane`
- Ensure worker-node-02 has label `nii/role=services-plane`

### 8. Production-Ready Observability (NEW)
- **Prometheus:** Discovers metrics via pod annotations + explicit static configs
    - Auto-discovers any pod with `prometheus.io/scrape: "true"` annotation
    - Scrapes Kafka (JMX via metrics ConfigMap), PostgreSQL, Qdrant, Redis, Ollama
    - 15-day retention, 20Gi storage, configurable alert rules
    - RBAC configured to access Kubernetes API for service discovery
- **Grafana:** Pre-provisioned dashboards + datasource
    - 4 dashboards out-of-the-box: Kafka Cluster, PostgreSQL, Redis, NII Platform Overview
    - Datasource auto-configured to scrape from Prometheus
    - Basic auth enabled (admin/admin — CHANGE IN PRODUCTION)
    - Ingress TLS via cert-manager on grafana.marafis.com
- **Alert Rules:** Proactive monitoring
    - Kafka broker down, under-replicated partitions
    - PostgreSQL high connections, availability
    - Redis memory, availability
    - Qdrant/Ollama availability
    - Rules stored in ConfigMap, can be updated without redeploying

