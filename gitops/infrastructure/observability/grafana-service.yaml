## Observability Architecture Details

  ### Prometheus Metric Scraping (prometheus-config.yaml)

  **Service Discovery Methods:**
  1. **Kubernetes API discovery** — Scrapes nodes, API server, kubelet
2. **Pod annotation discovery** — Scans all pods for `prometheus.io/scrape: "true"` annotation
  3. **Static configs** — Manual endpoint specification for known services
  
  **Endpoints Scraped in Phase 0:**
  ```
Kafka:       kafka-brokers (JMX via kafka-metrics ConfigMap exporter)
PostgreSQL:  postgresql.nii.svc:9187 (postgres-exporter)
Qdrant:      qdrant.nii.svc:6333 (native Qdrant metrics endpoint)
Redis:       redis.nii.svc:9121 (redis_exporter)
Ollama:      ollama.nii.svc:11434 (native Ollama health/tags endpoint)
  ```
  
  **Storage & Retention:**
- **Path:** `/prometheus` (mounted PVC)
- **Retention:** 15 days (configurable via `--storage.tsdb.retention.time`)
- **Size limit:** 18GB on 20Gi disk (2GB safety buffer)
- **Scrape interval:** 30 seconds (global default)
- **Query timeout:** 2 minutes
  
  ### Grafana Dashboard Provisioning (grafana-dashboards.yaml)
  
  **Pre-Built Dashboards (JSON in ConfigMap):**
  1. **Kafka Cluster Metrics**
  - Broker leader election timeline
  - Messages in/out per second
  - Under-replicated partition count
  2. **PostgreSQL Metrics**
  - Active connections (threshold: 150-190)
- Database uptime (seconds since postmaster start)
- Query latency (if pg_stat_statements enabled)
  3. **Redis Metrics**
- Memory usage (with LRU eviction thresholds)
- Commands processed (ops/sec)
- Keyspace information
  4. **NII Platform Overview**
- Pod health by job
- Service availability gauge
- Real-time status of all nii namespace services
  
  **Datasource Configuration:**
- Prometheus auto-provisioned via datasources ConfigMap
- URL: `http://prometheus.nii.svc:9090` (in-cluster)
- Default datasource for all dashboards
  
  ### Access & Security
  
  **Grafana:**
- **URL:** `https://grafana.marafis.com` (requires Ingress TLS + cert-manager)
- **Authentication:**
    - Admin login: default `admin:admin` (CHANGE IN PRODUCTION)
    - Basic auth on Ingress layer (htpasswd)
    - Can be disabled in `GF_USERS_ALLOW_SIGN_UP` if needed
- **Storage:** emptyDir (ephemeral, dashboards lost on pod restart — use persistent ConfigMaps in production)
  
  **Prometheus:**
- **URL:** `http://prometheus.nii.svc:9090` (cluster-internal only)
- **PromQL API:** `http://prometheus.nii.svc:9090/api/v1/query`
- **Alertmanager:** Configured but no alerts firing yet (webhook targets can be added)
  
  **Metrics Endpoints (Pod Annotations):**
- Format: `prometheus.io/scrape: "true"`, `prometheus.io/port: "XXXX"`, `prometheus.io/path: "/metrics"`
- If a service doesn't have these annotations, Prometheus won't auto-discover it
- Kafka, PostgreSQL, Qdrant, Redis, Ollama already have these configured

