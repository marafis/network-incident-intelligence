apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: nii
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: nii
    app.kubernetes.io/component: visualization
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: nii
  ports:
    - name: web
      port: 3000
      targetPort: web
      protocol: TCP

---
# Ingress for external access to Grafana
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: nii
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: nii
    app.kubernetes.io/component: visualization
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: grafana-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'NII Grafana Dashboard'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.marafis.com
      secretName: grafana-tls
  rules:
    - host: grafana.marafis.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

---
# Basic auth secret for Grafana ingress
# Username: admin, Password: admin (plaintext in example, use htpasswd in production)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-basic-auth
  namespace: nii
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: nii
type: Opaque
data:
  # htpasswd -c auth admin (and enter password when prompted)
  # For demo: admin:admin encoded as base64
  auth: YWRtaW46JGFwcjEkeDBFSDNvbnMkQ0F1T3JJbF95VlF1dmpIVVRkaDUwCg==