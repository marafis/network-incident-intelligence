apiVersion: v1
kind: ConfigMap
metadata:
  name: nii-prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: nii
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    # Prometheus configuration for NII Platform
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: 'nii'
        environment: 'development'
    
    # Alertmanager configuration (optional, can be added later)
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []
    
    # Rule files (alert rules)
    rule_files:
      - '/etc/prometheus/rules/*.yml'
    
    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
    
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
    
      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
    
      # Kubernetes pods via ServiceMonitor labels
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
    
      # Kafka broker metrics (JMX exporter)
      - job_name: 'kafka-brokers'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - nii
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: "kafka"
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "9404"
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
    
      # PostgreSQL exporter
      - job_name: 'postgresql'
        static_configs:
          - targets: ['postgresql.nii.svc:9187']
            labels:
              instance: 'postgresql-nii'
    
      # Qdrant metrics
      - job_name: 'qdrant'
        static_configs:
          - targets: ['qdrant.nii.svc:6333']
            labels:
              instance: 'qdrant-nii'
    
      # Redis exporter
      - job_name: 'redis'
        static_configs:
          - targets: ['redis.nii.svc:9121']
            labels:
              instance: 'redis-nii'
    
      # Ollama metrics
      - job_name: 'ollama'
        static_configs:
          - targets: ['ollama.nii.svc:11434']
            labels:
              instance: 'ollama-nii'

---
# Prometheus alert rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: nii
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: nii
    app.kubernetes.io/component: monitoring
data:
  alert-rules.yml: |
    groups:
      - name: nii_platform
        interval: 30s
        rules:
          # Kafka metrics
          - alert: KafkaBrokerDown
            expr: count(kafka_server_replica_manager_leader_count) < 3
            for: 2m
            labels:
              severity: critical
              component: kafka
            annotations:
              summary: "Kafka broker down"
              description: "Fewer than 3 Kafka brokers available. Current: {{ $value }}"
    
          - alert: KafkaUnderReplicatedPartitions
            expr: kafka_server_replica_manager_under_replicated_partitions > 0
            for: 5m
            labels:
              severity: warning
              component: kafka
            annotations:
              summary: "Kafka has under-replicated partitions"
              description: "{{ $value }} partitions are under-replicated"
    
          # PostgreSQL metrics
          - alert: PostgreSQLDown
            expr: up{job="postgresql"} == 0
            for: 1m
            labels:
              severity: critical
              component: postgresql
            annotations:
              summary: "PostgreSQL is down"
              description: "PostgreSQL database is not responding"
    
          - alert: PostgreSQLHighConnections
            expr: pg_stat_activity_count > 180
            for: 5m
            labels:
              severity: warning
              component: postgresql
            annotations:
              summary: "PostgreSQL high connection count"
              description: "PostgreSQL has {{ $value }} active connections (threshold: 200)"
    
          # Redis metrics
          - alert: RedisDown
            expr: up{job="redis"} == 0
            for: 1m
            labels:
              severity: critical
              component: redis
            annotations:
              summary: "Redis is down"
              description: "Redis cache is not responding"
    
          - alert: RedisHighMemory
            expr: redis_memory_used_bytes > 100000000
            for: 5m
            labels:
              severity: warning
              component: redis
            annotations:
              summary: "Redis high memory usage"
              description: "Redis memory usage is {{ humanize $value }} bytes"
    
          # Qdrant metrics
          - alert: QdrantDown
            expr: up{job="qdrant"} == 0
            for: 1m
            labels:
              severity: critical
              component: qdrant
            annotations:
              summary: "Qdrant vector store is down"
              description: "Qdrant service is not responding"
    
          # Ollama metrics
          - alert: OllamaDown
            expr: up{job="ollama"} == 0
            for: 2m
            labels:
              severity: critical
              component: ollama
            annotations:
              summary: "Ollama LLM service is down"
              description: "Ollama inference service is not responding"