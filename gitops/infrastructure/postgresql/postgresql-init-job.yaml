apiVersion: batch/v1
kind: Job
metadata:
  name: nii-postgresql-init
  namespace: nii

  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

  labels:
    app.kubernetes.io/name: postgresql-init
    app.kubernetes.io/instance: nii

spec:
  backoffLimit: 10

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql-init
        app.kubernetes.io/instance: nii

    spec:
      restartPolicy: OnFailure

      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: postgresql-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          env:
            # PostgreSQL server
            - name: PGHOST
              value: "nii-postgresql.nii.svc.cluster.local"

            - name: PGPORT
              value: "5432"

            # PostgreSQL administrator
            - name: PGUSER
              value: "postgres"

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nii-postgresql-credentials
                  key: postgres-password

            # Application database credentials
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nii-postgresql-credentials
                  key: incident-db-password

          command:
            - /bin/sh
            - -c
            - |
              set -eu

              echo "========================================="
              echo "Waiting for PostgreSQL..."
              echo "========================================="

              until pg_isready; do
                sleep 2
              done

              echo "PostgreSQL is ready."

              echo "Checking incident_db role..."

              ROLE_EXISTS=$(psql -tAc \
                "SELECT 1 FROM pg_roles WHERE rolname = 'incident_db'")

              if [ "$ROLE_EXISTS" = "1" ]; then
                echo "incident_db role already exists."
                echo "Synchronizing password..."

                psql -v ON_ERROR_STOP=1 \
                  --set=password="$APP_PASSWORD" \
                  -c "ALTER ROLE incident_db WITH LOGIN PASSWORD :'password';"

              else
                echo "Creating incident_db role..."

                psql -v ON_ERROR_STOP=1 \
                  --set=password="$APP_PASSWORD" \
                  -c "CREATE ROLE incident_db WITH LOGIN PASSWORD :'password';"
              fi

              echo "Checking incident_db database..."

              DATABASE_EXISTS=$(psql -tAc \
                "SELECT 1 FROM pg_database WHERE datname = 'incident_db'")

              if [ "$DATABASE_EXISTS" = "1" ]; then
                echo "incident_db database already exists."

              else
                echo "Creating incident_db database..."

                createdb \
                  -O incident_db \
                  incident_db
              fi

              echo "Ensuring database ownership..."

              psql -v ON_ERROR_STOP=1 \
                -c "ALTER DATABASE incident_db OWNER TO incident_db;"

              echo "========================================="
              echo "PostgreSQL initialization completed."
              echo "========================================="