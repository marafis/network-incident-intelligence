apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: nii
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: nii
    app.kubernetes.io/version: "16"
    app.kubernetes.io/component: database
    app.kubernetes.io/managed-by: argocd
spec:
  serviceName: postgresql
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
      app.kubernetes.io/instance: nii

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/instance: nii
        app.kubernetes.io/component: database
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
        prometheus.io/path: "/metrics"

    spec:
      # Affinity: run on data-plane worker
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nii/role
                    operator: In
                    values:
                      - data-plane

      # Security context
      securityContext:
        fsGroup: 999  # postgres user
        runAsNonRoot: true
        runAsUser: 999

      # Init container: create database and user
      initContainers:
        - name: init-database
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL to be ready..."
              until pg_isready -h 127.0.0.1 -U postgres -t 1; do
                sleep 1
              done
              echo "PostgreSQL is ready. Creating database and user..."
              
              psql -h 127.0.0.1 -U postgres -d postgres <<EOSQL
              CREATE DATABASE incident_db OWNER postgres;
              CREATE USER incident_db WITH ENCRYPTED PASSWORD '${INCIDENT_DB_PASSWORD}';
              GRANT ALL PRIVILEGES ON DATABASE incident_db TO incident_db;
              
              -- Connect to incident_db and grant schema privileges
              \c incident_db
              GRANT ALL ON SCHEMA public TO incident_db;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO incident_db;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO incident_db;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO incident_db;
              EOSQL
              
              echo "Database and user created successfully."
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-password
            - name: INCIDENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: incident-db-password
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d

      containers:
        # PostgreSQL main container
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-password
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_INITDB_ARGS
              value: "-c shared_buffers=128MB -c max_connections=200"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          # Health checks
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

          # Resource limits
          resources:
            requests:
              memory: "200Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          # Volume mounts
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

        # PostgreSQL exporter for Prometheus metrics
        - name: postgresql-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP

          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: postgres-admin-connection-string

          # Health checks
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1

          # Resource limits
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "100m"

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      # Volumes
      volumes:
        - name: init-scripts
          configMap:
            name: postgresql-init-scripts
            optional: true

  # Persistent volume claim templates
  volumeClaimTemplates:
    - metadata:
        name: postgresql-data
        labels:
          app.kubernetes.io/name: postgresql
          app.kubernetes.io/instance: nii
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi