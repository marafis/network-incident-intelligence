apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-simulator
  namespace: nii
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-simulator
  template:
    metadata:
      labels:
        app: alert-simulator
    spec:
      serviceAccountName: alert-simulator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        "nii/role": services-plane
      containers:
        - name: alert-simulator
          image: ghcr.io/marafis/alert-simulator:18dec05
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/simulator
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/simulator
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
