apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: nii-kafka
  namespace: nii-kafka
spec:
  kafka:
    replicas: 1

    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false

      - name: tls
        port: 9093
        type: internal
        tls: true

    storage:
      type: ephemeral

    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1

  # KRaft mode (NO ZOOKEEPER)
  kraft:
    enabled: true

  entityOperator:
    topicOperator: {}
    userOperator: {}