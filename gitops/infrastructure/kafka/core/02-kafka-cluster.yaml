apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: nii-kafka
  namespace: nii-kafka
spec:
  kafka:
    replicas: 1
    listeners:
      plain: {}
      tls: {}
    storage:
      type: ephemeral

  zookeeper:
    replicas: 1
    storage:
      type: ephemeral

  entityOperator:
    topicOperator: {}
    userOperator: {}