apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: default-pool
  namespace: nii-kafka
  labels:
    strimzi.io/cluster: nii-kafka
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: nii-kafka
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0 # This is mandatory for KRaft/1.0.0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}