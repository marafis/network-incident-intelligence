apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-kafka
spec:
  kafka:
    version: 3.7.0
    replicas: 3

    # KRaft mode (NO Zookeeper)
    kraft:
      clusterId: "generated-or-fixed-cluster-id"

    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true

    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2

    storage:
      type: persistent-claim
      size: 50Gi
      class: local-path

  # REQUIRED in KRaft mode: no zookeeper block at all
  entityOperator:
    topicOperator: {}
    userOperator: {}