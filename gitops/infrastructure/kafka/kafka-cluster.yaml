# WHY: Single-broker Kafka 3.7.0 on Zookeeper mode.
# Strimzi 0.43.0 supports Kafka 3.7.0 — pinned explicitly so
# the operator never auto-upgrades and breaks the cluster.
# All replication factors = 1 because we have one broker only.
# Setting them higher would cause under-replicated partition alerts.
#
# affinity.nodeAffinity instead of nodeSelector:
# Strimzi's CRD schema does not expose nodeSelector directly under
# template.pod — it uses the full Kubernetes affinity API.
# requiredDuringScheduling means pods NEVER schedule on control
# plane — keeps Server 1 free for ArgoCD, ingress, cert-manager.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-kafka
spec:
  kafka:
    version: 3.7.0
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: workload-type
                      operator: In
                      values:
                        - heavy
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "768Mi"
        cpu: "500m"
    storage:
      type: persistent-claim
      size: 10Gi
      class: local-path
      deleteClaim: false
  zookeeper:
    replicas: 1
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: workload-type
                      operator: In
                      values:
                        - heavy
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "384Mi"
        cpu: "300m"
    storage:
      type: persistent-claim
      size: 5Gi
      class: local-path
      deleteClaim: false
  entityOperator:
    # WHY: topicOperator watches KafkaTopic CRs and reconciles them
    # into real Kafka topics inside the broker. Without it, applying
    # kafka-topics.yaml would have no controller to act on it —
    # the topics would be created in Kubernetes but never in Kafka.
    topicOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"
    userOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"