apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-kafka
spec:
  kafka:
    version: 3.9.0
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
    template:
      pod:
        nodeSelector:
          workload-type: heavy
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "768Mi"
        cpu: "500m"
    storage:
      type: persistent-claim
      size: 10Gi
      class: local-path
      deleteClaim: false
  zookeeper:
    replicas: 1
    template:
      pod:
        nodeSelector:
          workload-type: heavy
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "384Mi"
        cpu: "300m"
    storage:
      type: persistent-claim
      size: 5Gi
      class: local-path
      deleteClaim: false
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"
    userOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"