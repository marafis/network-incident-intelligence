apiVersion: kafka.strimzi.io/v1beta1
kind: Kafka
metadata:
  name: nii-kafka
  namespace: nii-kafka
  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  kafka:
    replicas: 1
    listeners:
      plain: {}
      tls: {}
    storage:
      type: ephemeral
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1

  zookeeper:
    replicas: 1
    storage:
      type: ephemeral

  entityOperator:
    topicOperator: {}
    userOperator: {}