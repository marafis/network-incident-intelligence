apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-kafka
spec:
  kafka:
    version: 3.7.0
    replicas: 1   # IMPORTANT for your infra

    kraft: {}     # correct Strimzi KRaft mode

    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true

    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1

    storage:
      type: persistent-claim
      size: 10Gi
      class: local-path
      deleteClaim: false

  entityOperator:
    topicOperator: {}
    userOperator: {}