# WHY: KafkaTopic CRs are version-controlled topic definitions.
# The entityOperator's topicOperator reconciles these into real
# Kafka topics automatically — no CLI commands needed ever.
#
# network-alerts: primary inbound topic. All telecom alarm events
# produced by alert-simulator land here. 3 partitions = up to 3
# alert-consumer instances can process in parallel later.
#
# processed-incidents: output topic. incident-agent publishes
# enriched, LLM-classified incidents here. Downstream systems
# (dashboards, notifications) subscribe to this, not raw alerts —
# clean separation between raw ingestion and processed output.
#
# alerts-dead-letter: safety net. Any alert that fails processing
# (LLM timeout, unparseable payload, confidence below threshold)
# is published here instead of being lost. 30-day retention
# gives time to investigate and reprocess failures.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: network-alerts
  namespace: nii-kafka
  labels:
    strimzi.io/cluster: nii-kafka-cluster
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
    segment.bytes: "107374182"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: processed-incidents
  namespace: nii-kafka
  labels:
    strimzi.io/cluster: nii-kafka-cluster
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
    segment.bytes: "107374182"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: alerts-dead-letter
  namespace: nii-kafka
  labels:
    strimzi.io/cluster: nii-kafka-cluster
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "2592000000"