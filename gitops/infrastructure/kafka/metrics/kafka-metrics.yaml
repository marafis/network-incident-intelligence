apiVersion: v1
kind: ConfigMap
metadata:
  name: nii-kafka-metrics
  namespace: nii
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-cluster
    app.kubernetes.io/component: kafka-metrics
data:
  metrics-config.yaml: |
    # JMX Prometheus Exporter configuration for Kafka brokers
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    whitelistObjectNames:
      # Broker metrics
      - "kafka.server:type=ReplicaManager,name=LeaderCount"
      - "kafka.server:type=ReplicaManager,name=PartitionCount"
      - "kafka.server:type=ReplicaManager,name=UnderReplicatedPartitions"
      - "kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec"
      - "kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec"
      - "kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec"
      - "kafka.server:type=BrokerTopicMetrics,name=FailedProduceRequestsPerSec"
      - "kafka.server:type=BrokerTopicMetrics,name=FailedFetchRequestsPerSec"
      - "kafka.server:type=ReplicaFetcher,clientId=*,broker_id=*,name=BytesPerSecond"
      - "kafka.server:type=KafkaRequestHandlerPool,clientId=*,broker_id=*,name=AvgIdlePercent"
    
      # Network metrics
      - "kafka.network:type=RequestMetrics,clientId=*,request=*,name=TotalTimeMs"
      - "kafka.network:type=RequestMetrics,clientId=*,request=*,name=RequestsPerSec"
      - "kafka.network:type=SocketServer,clientId=*,networkProcessor=*,name=NetworkProcessorAvgIdlePercent"
      - "kafka.network:type=SocketServer,clientId=*,networkProcessor=*,name=IdlePercent"
    
      # Controller metrics
      - "kafka.controller:type=KafkaController,name=OfflinePartitionsCount"
      - "kafka.controller:type=KafkaController,name=PreferredReplicaImbalanceCount"
      - "kafka.controller:type=KafkaController,name=ActiveControllerCount"
      - "kafka.controller:type=KafkaController,name=ControllerState"
    
      # Group coordinator metrics
      - "kafka.coordinator.group:type=GroupCoordinator,clientId=*,broker_id=*,name=CommitLatencyMs"
      - "kafka.coordinator.group:type=GroupCoordinator,clientId=*,broker_id=*,name=JoinLatencyMs"
    
      # Topic metrics
      - "kafka.server:type=BrokerTopicMetrics,clientId=*,topic=*,name=*"
      - "kafka.server:type=DelayedOperationPurgatory,clientId=*,broker_id=*,purgatoryName=*,name=PurgatorySize"
    
      # JVM metrics
      - "java.lang:type=Memory"
      - "java.lang:type=GarbageCollector,name=*"
      - "java.lang:type=Threading"
      - "java.lang:type=Runtime"
    
    # Rules for label mappings
    rules:
      # Broker topic metrics
      - pattern: "kafka.server<type=(.+), clientId=(.+), topic=(.+), partition=(.*)><name=(.+)>"
        name: "kafka_server_$1_$5"
        labels:
          clientId: "$2"
          topic: "$3"
          partition: "$4"
    
      # General metrics
      - pattern: "kafka.(.+)<type=(.+), name=(.+), clientId=(.+), brokerid=(.+)><value=(.+)>"
        name: "kafka_$1_$2_$3"
        labels:
          clientId: "$4"
          broker_id: "$5"
    
      - pattern: "kafka.(.+)<type=(.+), name=(.+), clientId=(.+)><value=(.+)>"
        name: "kafka_$1_$2_$3"
        labels:
          clientId: "$4"
    
      - pattern: "kafka.(.+)<type=(.+), name=(.+)><value=(.+)>"
        name: "kafka_$1_$2_$3"
        value: "$4"
    
      # JVM memory
      - pattern: "java.lang<type=Memory><HeapMemoryUsage>(.+)"
        name: "jvm_heap_memory_$1"
    
      - pattern: "java.lang<type=Memory><NonHeapMemoryUsage>(.+)"
        name: "jvm_nonheap_memory_$1"
    
      # GC metrics
      - pattern: "java.lang<type=GarbageCollector, name=(.+)><CollectionCount>"
        name: "jvm_gc_collection_count"
        labels:
          gc: "$1"
    
      - pattern: "java.lang<type=GarbageCollector, name=(.+)><CollectionTime>"
        name: "jvm_gc_collection_time_ms"
        labels:
          gc: "$1"