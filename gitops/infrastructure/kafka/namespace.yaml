# WHY: Every project component lives in a dedicated namespace.
# Explicit namespace manifest gives us full GitOps control —
# we can annotate, label, or add ResourceQuotas later without
# touching the app manifest syncOptions.
apiVersion: v1
kind: Namespace
metadata:
  name: nii-kafka
  labels:
    app.kubernetes.io/part-of: network-incident-intelligence
    component: messaging