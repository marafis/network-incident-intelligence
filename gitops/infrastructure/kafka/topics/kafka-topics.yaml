# WHY: KafkaTopic CRs are version-controlled topic definitions.
# The entityOperator's topicOperator reconciles these into real
# Kafka topics automatically — no CLI commands ever needed.
# Topics are immutable infrastructure — changes go through Git.
#
# network-alerts: primary inbound stream. All telecom alarm events
# from alert-simulator land here. 3 partitions = up to 3 parallel
# alert-consumer instances when we scale later.
#
# processed-incidents: enriched output stream. incident-agent
# publishes LLM-classified incidents here after RAG + reasoning.
# Downstream consumers (dashboards, notifications) subscribe here,
# not to raw alerts — clean separation of raw vs processed data.
#
# alerts-dead-letter: safety net for failed processing. Any alert
# that hits LLM timeout, unparseable payload, or confidence below
# threshold is published here instead of being silently dropped.
# 30-day retention gives time to investigate and reprocess.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: network-alerts
  namespace: nii-kafka
  labels:
    strimzi.io/cluster: nii-kafka-cluster
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
    segment.bytes: "107374182"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: processed-incidents
  namespace: nii-kafka
  labels:
    strimzi.io/cluster: nii-kafka-cluster
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
    segment.bytes: "107374182"
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: alerts-dead-letter
  namespace: nii-kafka
  labels:
    strimzi.io/cluster: nii-kafka-cluster
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "2592000000"