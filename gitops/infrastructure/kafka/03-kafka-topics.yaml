# WHY: KafkaTopic CRs are version-controlled topic definitions.
# entityOperator's topicOperator reconciles these into real Kafka
# topics — no CLI commands ever needed. Topics are infrastructure,
# not application config — they belong in Git.
#
# network-alerts: primary inbound stream. All telecom alarm events
# produced by alert-simulator land here. 3 partitions allows up to
# 3 parallel alert-consumer instances when we scale later.
#
# processed-incidents: enriched output stream. incident-agent
# publishes LLM-classified incidents here after RAG + reasoning.
# Downstream consumers subscribe here, not to raw alerts —
# clean separation of raw ingestion from processed output.
#
# alerts-dead-letter: safety net. Any alert that fails processing
# (LLM timeout, unparseable payload, confidence below threshold)
# is published here instead of being silently dropped.
# 30-day retention gives time to investigate and reprocess.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: network-alerts
  namespace: nii-infrastructure
  labels:
    strimzi.io/cluster: nii-kafka-cluster
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
    segment.bytes: "107374182"
    compression.type: lz4
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: processed-incidents
  namespace: nii-infrastructure
  labels:
    strimzi.io/cluster: nii-kafka-cluster
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: "604800000"
    segment.bytes: "107374182"
    compression.type: lz4
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: alerts-dead-letter
  namespace: nii-infrastructure
  labels:
    strimzi.io/cluster: nii-kafka-cluster
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  partitions: 1
  replicas: 1
  config:
    retention.ms: "2592000000"
    compression.type: lz4