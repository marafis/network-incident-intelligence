# WHY: Strimzi 1.0.0 + Kafka 3.9.0 in KRaft mode.
# apiVersion v1beta2 — still the correct version in Strimzi 1.0.0.
# The two annotations enable KRaft mode and KafkaNodePool support —
# both are required, cluster CR is rejected without them.
#
# metadataVersion 3.9-IV0 — matches Kafka 3.9.0 exactly. Controls
# which KRaft protocol features are active. Must be updated manually
# when upgrading Kafka versions.
#
# All replication factors = 1 — single broker cluster. Setting higher
# values causes under-replicated partition alerts and prevents the
# cluster from ever becoming healthy on a single node.
#
# readinessProbe/livenessProbe with 60s initial delay — KRaft leader
# election on constrained hardware (2 CPU, 3.7Gi RAM) takes longer
# than default probe timing. Without this delay Kubernetes kills the
# pod before KRaft election completes, creating an infinite restart loop.
#
# entityOperator — manages KafkaTopic and KafkaUser CRs automatically.
# Without it, kafka-topics.yaml manifests are silently ignored.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-infrastructure
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
  labels:
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
      auto.create.topics.enable: "false"
      log.retention.hours: "168"
    readinessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 6
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"
    userOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"