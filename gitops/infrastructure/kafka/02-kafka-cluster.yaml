# 02-kafka-cluster.yaml
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-infrastructure
  labels:
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  kafka:
    version: 4.1.0 # Fully supported natively by Strimzi 1.0.0
    metadataVersion: 4.1-IV1 # Required inline parameter for 4.x KRaft consensus loop
    jvmOptions:
      "-Xms": "512m"
      "-Xmx": "512m"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: "false"
      log.retention.hours: 168
    readinessProbe:
      initialDelaySeconds: 60  # Tightened from 90s based on standard 1.0.0 examples
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
  entityOperator:
    topicOperator: {} # Reconciles your 03-kafka-topics.yaml using the highly optimized 1.0.0 inner loop
    userOperator: {}