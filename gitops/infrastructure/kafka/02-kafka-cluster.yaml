apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-infrastructure
  annotations:
    strimzi.io/node-pools: "enabled"  # Instructs Strimzi 1.0.0 to parse your node pool
  labels:
    app.kubernetes.io/part-of: network-incident-intelligence
spec:
  kafka:
    version: 4.1.0
    metadataVersion: 4.1-IV1
    jvmOptions:
      "-Xms": "512m"
      "-Xmx": "512m"
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 1  # Fixed: Raw numerical types, no quotes
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: "false"
      log.retention.hours: 168
    readinessProbe:
      initialDelaySeconds: 30 # Aggressive check to ensure you see quick transitions
      timeoutSeconds: 5
    livenessProbe:
      initialDelaySeconds: 30
      timeoutSeconds: 5
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"
    userOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"