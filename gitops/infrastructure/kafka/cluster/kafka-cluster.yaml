# WHY: KRaft mode requires the controller to complete leader election
# and the broker to complete registration before it can serve requests.
# On a resource-constrained single node this takes longer than the
# default probe timing allows. The result without this fix is a
# restart loop — readiness probe fires at 15s, broker returns 503
# because KRaft election isn't complete, Kubernetes kills the pod.
#
# initialDelaySeconds: 60 — gives KRaft leader election time to complete
# periodSeconds: 10 — check every 10s after initial delay
# failureThreshold: 6 — allow 6 consecutive failures (60s grace) before
# marking unready, preventing premature kills during slow starts.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
    readinessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 6
  entityOperator:
    topicOperator: {}
    userOperator: {}