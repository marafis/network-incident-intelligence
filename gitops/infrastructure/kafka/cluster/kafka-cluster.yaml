apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: nii
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-cluster
    app.kubernetes.io/component: kafka-cluster
    app.kubernetes.io/version: "3.9.0"
    app.kubernetes.io/managed-by: strimzi-operator
spec:
  kafka:
    version: "3.9.0"
    replicas: 3
    metadataVersion: "3.9-IV0"
    # --- ADDED BACK ---
    resources:
      requests:
        memory: 768Mi
        cpu: 500m
      limits:
        memory: 1Gi
        cpu: 1000m
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          storageClass: local-path
    jvmOptions:
      "-Xms": "512m"
      "-Xmx": "768m"
    # --- END ADDED ---
    config:
      controller.quorum.voters: "0@kafka-cluster-kafka-0.kafka-cluster-kafka-brokers.nii.svc:9095,1@kafka-cluster-kafka-1.kafka-cluster-kafka-brokers.nii.svc:9095,2@kafka-cluster-kafka-2.kafka-cluster-kafka-brokers.nii.svc:9095"
      controller.listener.names: controller
      inter.broker.listener.name: plaintext
      log.retention.hours: 168
      log.segment.bytes: 1073741824
      num.network.threads: 4
      num.io.threads: 4
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600
      min.insync.replicas: 2
      default.replication.factor: 3
      group.initial.rebalance.delay.ms: 3000
      offsets.retention.minutes: 10080
      offsets.topic.replication.factor: 3
      offsets.topic.min.insync.replicas: 2
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
    listeners:
      - name: plaintext
        port: 9092
        type: internal
        tls: false
        # authentication removed – no auth
      - name: controller
        port: 9095
        type: internal
        tls: false
      - name: external
        port: 9094
        type: nodeport
        tls: false
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nii/role
                      operator: In
                      values:
                        - data-plane
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: nii-kafka-metrics
          key: metrics-config.yaml
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m
    userOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m