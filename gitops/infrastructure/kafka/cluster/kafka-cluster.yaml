# WHY: Strimzi 1.0.0 + Kafka 3.9.0 in KRaft mode.
# Zookeeper is fully removed in Strimzi 1.0.0 — KRaft is the only
# supported mode. The two annotations below are required to enable
# KRaft and KafkaNodePool support — without them the CR is rejected.
#
# metadataVersion 3.9-IV0 — matches Kafka 3.9.0. Must be updated
# manually when upgrading Kafka versions to unlock new protocol features.
#
# entityOperator with empty {} uses operator defaults — sufficient
# for our setup. It manages KafkaTopic and KafkaUser CRs automatically.
# Without it, kafka-topics.yaml manifests are ignored entirely.
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # WHY: All replication factors = 1 because we have a single broker.
      # Setting them higher would cause under-replicated partition alerts
      # and prevent the cluster from becoming healthy.
      offsets.topic.replication.factor: "1"
      transaction.state.log.replication.factor: "1"
      transaction.state.log.min.isr: "1"
      default.replication.factor: "1"
      min.insync.replicas: "1"
    readinessProbe:
      # WHY: KRaft leader election on constrained hardware takes longer
      # than default probe timing. 60s initial delay + 6 failures × 10s
      # = 120s total grace period before Kubernetes marks pod unready.
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 6
    livenessProbe:
      initialDelaySeconds: 60
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 6
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"
    userOperator:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "192Mi"
          cpu: "200m"