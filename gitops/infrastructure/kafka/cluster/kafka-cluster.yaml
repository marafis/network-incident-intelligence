apiVersion: kafka.strimzi.io/v1beta1
kind: Kafka
metadata:
  name: nii-kafka-cluster
  namespace: nii
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: nii-kafka-cluster
    app.kubernetes.io/component: nii-kafka-cluster
    app.kubernetes.io/version: "3.9.0"
    app.kubernetes.io/managed-by: strimzi-operator
spec:
  kafka:
    version: "3.9.0"
    replicas: 3

    # KRaft mode (no Zookeeper)
    metadataVersion: "3.9-IV0"

    # Broker configuration
    config:
      # KRaft Controller settings
      controller.quorum.voters: "0@kafka-cluster-kafka-0.kafka-cluster-kafka-brokers.nii.svc:9090,1@kafka-cluster-kafka-1.kafka-cluster-kafka-brokers.nii.svc:9090,2@kafka-cluster-kafka-2.kafka-cluster-kafka-brokers.nii.svc:9090"
      controller.listener.names: CONTROLLER
      inter.broker.listener.name: PLAINTEXT

      # Log retention
      log.retention.hours: 168  # 7 days
      log.segment.bytes: 1073741824  # 1GB segments

      # Performance tuning
      num.network.threads: 4
      num.io.threads: 4
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600

      # Replication
      min.insync.replicas: 2
      default.replication.factor: 3

      # Group coordinator
      group.initial.rebalance.delay.ms: 3000

      # Offsets
      offsets.retention.minutes: 10080  # 7 days
      offsets.topic.replication.factor: 3
      offsets.topic.min.insync.replicas: 2

      # Transaction logs
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2

      # Broker rack awareness
      broker.rack: "${POD_NAME%%-*}"

    # Listeners
    listeners:
      # Internal listener for broker-to-broker and internal clients
      - name: PLAINTEXT
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
      # Controller listener for KRaft quorum
      - name: CONTROLLER
        port: 9090
        type: internal
        tls: false
      # External listener (optional, for future external access)
      - name: EXTERNAL
        port: 9094
        type: nodeport
        tls: false

    # Storage configuration (JBOD - single volume per broker)
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          class: local-path
          selector:
            matchLabels:
              app.kubernetes.io/name: kafka
              app.kubernetes.io/instance: kafka-cluster

    # Pod template for node affinity and resource limits
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: nii/role
                      operator: In
                      values:
                        - data-plane

      # Resource requests and limits
      containers:
        - name: kafka
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

      # Liveness and readiness probes
      initContainers:
        - name: leader-elector
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"

    # JVM tuning
    jvmOptions:
      "-Xms": "512m"
      "-Xmx": "768m"
      "-XX":
        - "+UseG1GC"
        - "+ParallelRefProcEnabled"
        - "+UnlockDiagnosticVMOptions"
        - "-XX:G1NewCollectionHeuristicPercent=35"
        - "-XX:MaxGCPauseMillis=20"
        - "-XX:InitiatingHeapOccupancyPercent=35"
        - "-XX:+DisableExplicitGC"
        - "-XX:+PrintFlagsFinal"

    # Metrics
    metricsConfig:
      type: jmxPrometheusExporter
      valueSecret:
        name: kafka-metrics
        key: metrics-config.yaml

  # Broker node pool (broker assignment to worker nodes)
  nodePool:
    - name: data-plane
      replicas: 3
      storage:
        type: jbod
        volumes:
          - id: 0
            type: persistent-claim
            size: 20Gi
            class: local-path
      roles:
        - broker
      template:
        pod:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nii/role
                        operator: In
                        values:
                          - data-plane

  # ZooKeeper is disabled (KRaft mode)
  zookeeper:
    replicas: 0

  # Entity Operator (only needed for topic management, not KRaft)
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    userOperator:
      resources:
        requests:
          memory: "256Mi"
          cpu: "100m"
        limits:
          memory: "512Mi"
          cpu: "500m"
    template:
      pod:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: nii/role
                      operator: In
                      values:
                        - data-plane