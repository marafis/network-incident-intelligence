apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: kafka-cluster-broker-pool
  namespace: nii
  labels:
    strimzi.io/cluster: kafka-cluster   # must match the Kafka CR name
spec:
  replicas: 3
  roles:
    - broker
  resources:
    requests:
      memory: 768Mi
      cpu: 500m
    limits:
      memory: 1Gi
      cpu: 1000m
  # Optional: you can also place storage and jvmOptions here,
  # but they are already defined in the Kafka CR. Strimzi will merge them.
  # For simplicity, keep storage/jvmOptions in the Kafka CR.