apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: nii
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: nii
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      app.kubernetes.io/instance: nii

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/instance: nii
        app.kubernetes.io/component: vector-store
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6333"
        prometheus.io/path: "/metrics"

    spec:
      # Affinity: run on data-plane worker
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nii/role
                    operator: In
                    values:
                      - data-plane

      # Security context
      securityContext:
        fsGroup: 101  # qdrant user
        runAsNonRoot: true
        runAsUser: 101

      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          imagePullPolicy: Always

          ports:
            - name: api
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP

          env:
            # Configuration via environment variables
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/snapshots
            - name: QDRANT__STORAGE__COLLECTIONS_PATH
              value: /qdrant/collections
            - name: QDRANT__STORAGE__TEMP_PATH
              value: /qdrant/temp

            # Optimize for embedded vector storage
            - name: QDRANT__LOG_LEVEL
              value: "INFO"

            # Performance tuning
            - name: QDRANT__PERFORMANCE__MAX_SEARCH_BATCH_SIZE
              value: "10000"

            # API settings
            - name: QDRANT__API_KEY
              valueFrom:
                secretKeyRef:
                  name: qdrant-api-key
                  key: api-key

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3

          # Resource limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Volume mounts
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant
            - name: qdrant-config
              mountPath: /etc/qdrant

          # Security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

      # Volumes
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: qdrant-data
        - name: qdrant-config
          configMap:
            name: qdrant-config
            optional: true