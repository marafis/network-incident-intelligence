apiVersion: apps/v1
kind: Deployment
metadata:
  name: nii-qdrant
  namespace: nii
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: nii
    app.kubernetes.io/version: latest
    app.kubernetes.io/component: vector-store
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      app.kubernetes.io/instance: nii
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/instance: nii
        app.kubernetes.io/component: vector-store
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "6333"
        prometheus.io/path: "/metrics"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nii/role
                    operator: In
                    values:
                      - data-plane
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nii-qdrant
          image: qdrant/qdrant:latest
          imagePullPolicy: Always
          ports:
            - name: api
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP
          env:
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/data/snapshots
            - name: QDRANT__STORAGE__COLLECTIONS_PATH
              value: /qdrant/data/collections
            - name: QDRANT__STORAGE__TEMP_PATH
              value: /qdrant/data/temp
            - name: QDRANT__LOG_LEVEL
              value: "INFO"
            - name: QDRANT__PERFORMANCE__MAX_SEARCH_BATCH_SIZE
              value: "10000"
            - name: QDRANT__API_KEY
              valueFrom:
                secretKeyRef:
                  name: nii-qdrant-api-key
                  key: api-key
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: nii-qdrant-data
              mountPath: /qdrant/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: nii-qdrant-data
          persistentVolumeClaim:
            claimName: nii-qdrant-data