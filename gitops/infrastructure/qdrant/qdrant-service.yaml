apiVersion: v1
kind: Service
metadata:
  name: nii-qdrant
  namespace: nii
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: nii
    app.kubernetes.io/component: vector-store
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: nii
  ports:
    - name: api
      port: 6333
      targetPort: api
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: grpc
      protocol: TCP