apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-consumer
  namespace: nii
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-consumer
  template:
    metadata:
      labels:
        app: alert-consumer
    spec:
      serviceAccountName: alert-consumer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-consumer
          image: ghcr.io/marafis/alert-consumer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health/consumer
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/consumer
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10

