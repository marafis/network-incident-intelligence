apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-labeler-sa
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-labeler-crb
subjects:
  - kind: ServiceAccount
    name: node-labeler-sa
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nii-node-labeler
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nii-node-labeler
  template:
    metadata:
      labels:
        name: nii-node-labeler
    spec:
      serviceAccountName: node-labeler-sa
      containers:
        - name: labeler
          image: bitnami/kubectl:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ "$(kubectl get node $NODE_NAME --show-labels | grep -c 'nii/role=data-plane')" -eq 0 ]; then
                kubectl label node $NODE_NAME nii/role=data-plane
              fi
              sleep infinity
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName